name: neurofriend_mobile
description: NeuroFriend mobile/web client (initialize with flutter create if needed).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  # 6.x тянет совместимые record_* (5.x + старый record_linux ломали сборку Windows из‑за hasPermission).
  record: ^6.2.0
  path_provider: ^2.1.4
  audioplayers: ^6.1.0
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
